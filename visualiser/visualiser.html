<style>
:root {

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 0 16px 60px; }
h1 { font-size: 24px; margin: 24px 0 2px; }
.muted { color: var(--muted); }
a { color: var(--accent); }
.scenes { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; }
.scenes button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px;
                 padding: 3px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.scenes button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.scenes button.done { color: var(--ink); }
.player { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
canvas#stage { display: block; width: 100%; aspect-ratio: 16 / 9; background: var(--stage); }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.bar button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 5px 12px; font: inherit; font-size: 14px; cursor: pointer; }
.bar button.main { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 92px; }
.bar input[type=range] { flex: 1 1 200px; }
.bar label { font-size: 13px; color: var(--muted); }
.caption { padding: 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .caption { grid-template-columns: 1fr; } }
.caption h2 { margin: 0 0 4px; font-size: 19px; }
.caption p { margin: 4px 0; }
.code { background: var(--code); border-radius: 8px; padding: 10px 12px; font: 13px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
.code .nb { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
.code .c { color: var(--muted); }
</style>
</head>

<main>

  text: "A wafer the forest never saw: features() makes its 14 numbers, every tree walks its questions down to an answer, and for each defect the forest counts how many of the 300 trees say yes. More than half: the answer is 1.",
  nb: "06_evaluate_and_rank, 09_demo",
  code: "x = np.array([features(wafer)])   # (1, 14): a table of one row\nforest.predict_proba(x)           # per defect: share of trees saying no / yes\nforest.predict(x)[0]              # 8 zeros and ones, like a label",
  draw(t) {
    const P = DATA.predict;
    wafer(P.map, 30, 40, 150, ease(seg(t, 0, 0.08)));
    text("test wafer", 30, 30, { size: 13, color: C.muted });
    // Its 14 numbers
    const f = ease(seg(t, 0.05, 0.15));
    DATA.features.values.forEach((v, i) => {
      rect(30 + i * 11, 300 - 100 * v * f, 9, 100 * v * f, { fill: i === 0 ? C.fail : i <= 5 ? C.accent : C.orange, r: 1 });
    });
    text("x  (1, 14)", 30, 322, { mono: true, size: 14, weight: 700, alpha: f });
    // The path through tree 1
    const pth = seg(t, 0.15, 0.42);
    text("tree 1 of 300 asks:", 240, 34, { size: 14, weight: 700, alpha: seg(t, 0.15, 0.18) });
    P.path.slice(0, 9).forEach((s, i) => {
      const a = clamp(pth * 9 - i);
      text(`${s.feature} = ${s.value.toFixed(3)} ≤ ${s.threshold.toFixed(3)} ?`, 240 + i * 8, 62 + i * 24, { mono: true, size: 13, alpha: a });
      text(s.yes ? "yes ↙" : "no ↘", 560 + i * 8, 62 + i * 24, { size: 13, weight: 700, color: s.yes ? C.green : C.fail, alpha: a });
    });
    if (P.depth > 9) text(`… ${P.depth - 9} more questions to the end of the branch`, 240, 62 + 9 * 24, { size: 13, color: C.muted, alpha: clamp(pth * 9 - 9) });
    // Every tree votes, per defect
    const v = seg(t, 0.45, 0.8);
    if (v > 0) {
      ctx.globalAlpha = 1;
      text("all 300 trees, per defect (green = yes):", 240, 306, { size: 14, weight: 700 });
      P.votes.forEach((row, d) => {
        const y = 318 + d * 26, shown = Math.floor(v * 300);
        let yes = 0;
        for (let i = 0; i < shown; i++) {
          const say = row[i] === "1";
          if (say) yes++;
          ctx.fillStyle = say ? C.green : C.empty;
          ctx.fillRect(330 + i * 1.6, y, 1.3, 18);
        }
        text(D[d], 322, y + 14, { size: 12, align: "right" });
        if (shown > 0) {
          const half = yes > shown / 2;
          text(`${yes} / ${shown} yes`, 820, y + 14, { size: 12, mono: true, weight: 700, color: half ? C.green : C.muted });
          if (shown === 300) text(half ? "→ 1" : "→ 0", 930, y + 14, { size: 13, mono: true, weight: 700, color: half ? C.green : C.muted, align: "right" });
        }
      });
      text("more than half of the trees say yes  →  1", 330, 534, { size: 12, color: C.muted, alpha: seg(t, 0.75, 0.8) });
    }
    // The answer
    const a = ease(seg(t, 0.82, 0.95));
    if (a > 0) {
      text("forest.predict(x)[0]", 640, 40, { mono: true, size: 14, alpha: a });
      bits(P.said, 640, 52, { size: 30, names: false, reveal: a });
      text(`'${nameOf(P.said)}'`, 640, 120, { size: 22, weight: 700, color: C.accent, alpha: a });
      const same = P.said.every((b, i) => b === P.truth[i]);
      text(`truth: '${P.name}'  ${same ? "✓" : "✗"}`, 640, 152, { size: 15, color: same ? C.green : C.fail, weight: 700, alpha: seg(t, 0.92, 1) });
    }
  },
},
{
  title: "12. Scoring: found, missed, false alarm", seconds: 12,
  text: "The forest answers for every test wafer. For one defect each wafer falls in one box: it was there and the model said yes (found), it was there but the model said no (missed), it wasn't there but the model said yes (false alarm), or neither. Recall and precision are counted from those boxes.",
  nb: "06_evaluate_and_rank, wafer.py",
  code: "really_there = y_test[:, i] == 1\nsaid_yes = y_pred[:, i] == 1\nfound = (really_there & said_yes).sum()\nrecall = found / (found + missed)\nprecision = found / (found + false_alarm)",
  draw(t) {
    const S = DATA.scores, d = 0, s = S.per_defect[d];
    text(`defect: ${D[d]}, all ${fmt(S.n)} test wafers`, 40, 34, { size: 16, weight: 700 });
    const boxes = [
      ["found", s.found, C.green, 380, 70, "there, said yes"], ["missed", s.missed, C.fail, 650, 70, "there, said no"],
      ["false_alarm", s.false_alarm, C.orange, 380, 260, "not there, said yes"], ["rest", s.rest, C.grey, 650, 260, "not there, said no"]];
    boxes.forEach(([name, n, col, x, y, sub]) => {
      rect(x, y, 250, 170, { stroke: col, width: 2.5, alpha: seg(t, 0, 0.1) });
      text(name, x + 12, y + 24, { size: 15, weight: 700, color: col, mono: true });
      text(sub, x + 12, y + 44, { size: 12, color: C.muted });
    });
    // 100 dots, shared out like the real counts
    const total = s.found + s.missed + s.false_alarm + s.rest;
    const per = boxes.map(b => Math.round(b[1] / total * 100));
    let k = 0;
    per.forEach((n, b) => {
      for (let j = 0; j < n; j++, k++) {
        const p = ease(seg(t, 0.12 + k * 0.004, 0.3 + k * 0.004));
        const x = lerp(40 + (k % 10) * 26, boxes[b][3] + 14 + (j % 12) * 19, p);
        const y = lerp(70 + Math.floor(k / 10) * 26, boxes[b][4] + 60 + Math.floor(j / 12) * 19, p);
        ctx.beginPath(); ctx.arc(x + 8, y + 8, 7, 0, 7);
        ctx.fillStyle = p > 0.5 ? boxes[b][2] : C.muted; ctx.fill();
      }
    });
    text("1 dot ≈ " + Math.round(total / 100) + " wafers", 40, 350, { size: 12, color: C.muted });
    const c = seg(t, 0.62, 0.72);
    boxes.forEach(([name, n, col, x, y]) => text(fmt(n * c), x + 236, y + 24, { size: 18, weight: 700, align: "right", alpha: c }));
    const r = ease(seg(t, 0.75, 0.9));
    text(`recall      = ${s.found} / (${s.found} + ${s.missed}) = ${(s.found / (s.found + s.missed)).toFixed(3)}`, 40, 470, { mono: true, size: 17, weight: 700, alpha: r });
    text(`precision = ${s.found} / (${s.found} + ${s.false_alarm}) = ${(s.found / (s.found + s.false_alarm)).toFixed(3)}`, 40, 505, { mono: true, size: 17, weight: 700, alpha: seg(t, 0.85, 0.97) });
  },
},
];

/* the player */
let scene = 0, t = 0, playing = false, last = 0;
const $ = id => document.getElementById(id);

function resize() {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientWidth * 9 / 16 * ratio;
  render();
}
function render() {
  const s = canvas.width / W;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.fillStyle = C.stage;
  ctx.fillRect(0, 0, W, H);
  SCENES[scene].draw(t);
  $("scrub").value = Math.round(t * 1000);
}
function caption() {
  const S = SCENES[scene];
  $("cap-title").textContent = S.title;
  $("cap-text").textContent = S.text;
  $("cap-code").innerHTML = `<span class="nb">${S.nb}</span>` + S.code.split("\n").map(l => {
    const at = l.indexOf("#");
    const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    return at >= 0 ? esc(l.slice(0, at)) + `<span class="c">${esc(l.slice(at))}</span>` : esc(l);
  }).join("\n");
  document.querySelectorAll("#scenes button").forEach((b, i) => { b.classList.toggle("on", i === scene); b.classList.toggle("done", i < scene); });
}
function go(i, autoplay) {
  scene = (i + SCENES.length) % SCENES.length;
  t = 0;
  caption();
  setPlaying(autoplay);
  render();
}
function setPlaying(on) {
  playing = on;
  $("play").textContent = on ? "❚❚ pause" : t >= 1 ? "↻ again" : "▶ play";
  last = performance.now();
  if (on) requestAnimationFrame(tick);
}
function tick(now) {
  if (!playing) return;
  t += (now - last) / 1000 / SCENES[scene].seconds * +$("speed").value;
  last = now;
  if (t >= 1) {
    t = 1;
    render();
    if ($("auto").checked && scene < SCENES.length - 1) { setTimeout(() => { if (playing) go(scene + 1, true); }, 900); }
    else setPlaying(false);
    return;
  }
  render();
  requestAnimationFrame(tick);
}

SCENES.forEach((s, i) => {
  const b = document.createElement("button");
  b.textContent = s.title.replace(/:.*/, "");
  b.title = s.title;
  b.onclick = () => go(i, true);
  $("scenes").append(b);
});
$("play").onclick = () => { if (t >= 1) t = 0; setPlaying(!playing); };
$("prev").onclick = () => go(scene - 1, true);
$("next").onclick = () => go(scene + 1, true);
$("scrub").oninput = ev => { setPlaying(false); t = ev.target.value / 1000; render(); };
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") return;
  if (ev.key === " ") { ev.preventDefault(); $("play").click(); }
  if (ev.key === "ArrowRight") go(scene + 1, true);
  if (ev.key === "ArrowLeft") go(scene - 1, true);
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readColors(); render(); });
window.addEventListener("resize", resize);

readColors();
caption();
resize();
</script>
